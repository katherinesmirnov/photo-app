name: Deploy Photo App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, photo-app]
    steps:
      - uses: actions/checkout@v4

      - name: Build and restart
        env:
          HOST_DATA_DIR: ${{ secrets.HOST_DATA_DIR }}
          HOST_UPLOADS_DIR: ${{ secrets.HOST_UPLOADS_DIR }}
        run: docker compose up -d --build --remove-orphans

      - name: Prune old images
        run: docker image prune -f
